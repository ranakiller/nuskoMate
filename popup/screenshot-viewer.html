<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Screenshot — Nuskomate</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start; gap: 16px; padding: 24px 16px 40px;
    background: #f4f6fb; font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) { body { background: #12141c; } }
  img { max-width: min(96vw, 1400px); box-shadow: 0 8px 30px rgba(0,0,0,.18); border-radius: 8px; background: #fff; }
  .bar { display: flex; gap: 10px; align-items: center; }
  button {
    font: 600 13px/1 "Segoe UI", system-ui, sans-serif; padding: 9px 16px; border-radius: 8px;
    border: 1px solid #4f6ef7; background: #4f6ef7; color: #fff; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; color: #4f6ef7; }
  @media (prefers-color-scheme: dark) { button.ghost { color: #6c8bff; border-color: #6c8bff; } }
  .empty { color: #6b7a99; font-size: 14px; padding-top: 60px; text-align: center; max-width: 320px; }
</style>
</head>
<body>
  <div class="bar">
    <button id="dl">Download</button>
    <button id="copy" class="ghost">Copy to clipboard</button>
  </div>
  <img id="img" hidden alt="Captured screenshot">
  <div id="empty" class="empty" hidden>No screenshot found here — this page is only meant to be opened right after a capture.</div>
  <script src="screenshot-viewer.js"></script>
</body>
</html>

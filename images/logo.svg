<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gear gradient -->
    <linearGradient id="gearOuter" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" style="stop-color:#5b9fff"/>
      <stop offset="45%" style="stop-color:#1a5fd4"/>
      <stop offset="100%" style="stop-color:#0d2f8a"/>
    </linearGradient>

    <!-- Gear bevel edge -->
    <linearGradient id="gearEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7ab3ff"/>
      <stop offset="100%" style="stop-color:#0a2060"/>
    </linearGradient>

    <!-- Inner dome gradient -->
    <radialGradient id="dome" cx="38%" cy="30%" r="65%">
      <stop offset="0%" style="stop-color:#ddeeff"/>
      <stop offset="25%" style="stop-color:#7ab0ff"/>
      <stop offset="70%" style="stop-color:#1a4fd8"/>
      <stop offset="100%" style="stop-color:#0b2070"/>
    </radialGradient>

    <!-- Dome rim -->
    <radialGradient id="domeRim" cx="50%" cy="50%" r="50%">
      <stop offset="70%" style="stop-color:#0d2a90"/>
      <stop offset="100%" style="stop-color:#051440"/>
    </radialGradient>

    <!-- Circuit dot -->
    <radialGradient id="dot" cx="38%" cy="32%" r="60%">
      <stop offset="0%" style="stop-color:#aad4ff"/>
      <stop offset="50%" style="stop-color:#3a80ff"/>
      <stop offset="100%" style="stop-color:#0a2a90"/>
    </radialGradient>

    <!-- Soft glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Drop shadow -->
    <filter id="shadow" x="-15%" y="-10%" width="140%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#030d3a" flood-opacity="0.6"/>
    </filter>

    <!-- Inner shadow on dome -->
    <filter id="innerShadow">
      <feOffset dx="0" dy="3"/>
      <feGaussianBlur stdDeviation="4"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- ── GEAR ─────────────────────────────────────────────────── -->
  <!--
    Gear: 12 teeth, centre (256,256), outer radius 210, tooth height 34,
    inner radius (between teeth) 176, hub radius 130
  -->
  <g filter="url(#shadow)">
    <path fill="url(#gearOuter)" stroke="url(#gearEdge)" stroke-width="3" d="
      M 256,46
      L 274,46 L 282,76
      Q 308,83 330,96
      L 358,78 L 372,92
      L 354,120
      Q 371,140 382,164
      L 414,158 L 420,178
      L 394,196
      Q 398,220 396,244
      L 426,254 L 426,274
      L 396,280
      Q 394,304 386,326
      L 412,346 L 406,366
      L 376,358
      Q 360,378 340,392
      L 348,424 L 330,432
      L 310,406
      Q 286,414 262,416
      L 256,448 L 238,448
      L 232,416
      Q 208,412 186,402
      L 164,428 L 146,420
      L 156,388
      Q 138,374 124,356
      L 92,364 L 86,344
      L 114,326
      Q 106,304 106,280
      L 76,274 L 76,254
      L 106,246
      Q 108,222 116,200
      L 90,182 L 96,162
      L 128,168
      Q 140,144 158,124
      L 142,96 L 156,82
      L 184,100
      Q 206,88 230,82 Z
    "/>

    <!-- Gear inner track (bevel) -->
    <circle cx="256" cy="247" r="134" fill="#0d2060" opacity="0.5"/>
    <circle cx="256" cy="247" r="130" fill="url(#domeRim)"/>
    <!-- Dome face -->
    <circle cx="256" cy="247" r="118" fill="url(#dome)"/>
  </g>

  <!-- Dome top highlight arc -->
  <path d="M 200,210 Q 226,188 256,186 Q 286,188 308,206"
    fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="9"
    stroke-linecap="round"/>
  <!-- Secondary soft highlight -->
  <path d="M 216,220 Q 234,206 256,204"
    fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="5"
    stroke-linecap="round"/>

  <!-- ── LETTER N ─────────────────────────────────────────────── -->
  <!-- Shadow layer -->
  <text x="258" y="272"
    font-family="'Arial Black','Franklin Gothic Heavy',Impact,sans-serif"
    font-weight="900" font-size="112"
    text-anchor="middle" dominant-baseline="middle"
    fill="#04144a" opacity="0.55">N</text>
  <!-- Main white letter -->
  <text x="256" y="268"
    font-family="'Arial Black','Franklin Gothic Heavy',Impact,sans-serif"
    font-weight="900" font-size="112"
    text-anchor="middle" dominant-baseline="middle"
    fill="white"
    filter="url(#glow)">N</text>

  <!-- ── CIRCUIT LINES ──────────────────────────────────────────── -->
  <g filter="url(#glow)">
    <!-- Top wire -->
    <polyline points="386,210  420,210  432,196  468,196"
      fill="none" stroke="#4a8fff" stroke-width="5.5"
      stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Mid wire -->
    <line x1="390" y1="248" x2="470" y2="248"
      fill="none" stroke="#4a8fff" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Bottom wire -->
    <polyline points="386,286  420,286  432,300  468,300"
      fill="none" stroke="#4a8fff" stroke-width="5.5"
      stroke-linecap="round" stroke-linejoin="round"/>

    <!-- End dots -->
    <circle cx="470" cy="196" r="11" fill="url(#dot)" stroke="#a0ccff" stroke-width="2.5"/>
    <circle cx="470" cy="248" r="11" fill="url(#dot)" stroke="#a0ccff" stroke-width="2.5"/>
    <circle cx="470" cy="300" r="11" fill="url(#dot)" stroke="#a0ccff" stroke-width="2.5"/>

    <!-- Dot shine -->
    <circle cx="466" cy="193" r="4" fill="rgba(255,255,255,0.75)"/>
    <circle cx="466" cy="245" r="4" fill="rgba(255,255,255,0.75)"/>
    <circle cx="466" cy="297" r="4" fill="rgba(255,255,255,0.75)"/>
  </g>

</svg>
